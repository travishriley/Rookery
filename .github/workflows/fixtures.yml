name: Offline fixtures

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
          architecture: x64
          pip-version: '25.2'
      - run: python -m pip install --only-binary=:all: -r requirements-design.txt
      - run: python tools/check_design.py
      - run: python -m unittest discover -s tools -p test_check_design.py -v
      - run: git diff origin/main...HEAD --check

  unit-fixtures:
    name: unit-fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
          architecture: x64
          pip-version: '25.2'
      - run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - run: python -m pip wheel . --no-deps --no-build-isolation --no-index --wheel-dir dist
      - run: python -m pip install --no-deps --no-index dist/rookery_core-0.1.0.dev1-py3-none-any.whl
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Verification scope
        if: always()
        run: python -c "print('Fixture parsing and installed-package tests only. No worker isolation, source import, backup/restore, policy authorization, slicer or physical printer test was executed.')"
